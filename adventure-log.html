<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your five most recent SideQuest adventures.">
  <title>Adventure Log | SideQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=cozy-journal">
  <script src="script.js?v=saved-quests-page" defer></script>
</head>
<body>
  <main class="page-shell adventure-log-shell">
    <section class="hero adventure-log-page" aria-labelledby="page-title">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="quiz.html">Find My Quest</a>
        <a href="adventure-log.html" aria-current="page">Adventure Log</a>
        <a href="saved-quests.html">Saved Quests</a>
      </nav>

      <a class="brand-mark brand-link" href="index.html" aria-label="SideQuest home">
        <span aria-hidden="true">↗</span>
      </a>

      <p class="eyebrow">Your adventure log</p>
      <h1 id="page-title" class="adventure-log-title">Recent<br><span>SideQuests.</span></h1>
      <p class="intro adventure-log-intro">A look back at the little adventures that found you.</p>

      <section class="recent-quests adventure-log-list" id="recent-quests" aria-labelledby="recent-quests-title">
        <h2 class="visually-hidden" id="recent-quests-title">Recent SideQuests</h2>
        <p class="recent-quests-empty" id="recent-quests-empty" hidden>
          No adventures logged yet. Go find a <a href="index.html">SideQuest!</a>
        </p>
        <ol class="recent-quests-list" id="recent-quests-list"></ol>
      </section>
    </section>
  </main>

  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>
</body>
</html>
