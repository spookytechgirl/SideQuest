<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SideQuest generates quick, simple activities whenever you want to shake up your day.">
  <title>SideQuest | Find Your Next Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=saved-quests-page">
  <script src="script.js?v=saved-quests-page" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="quiz.html">Find My Quest</a>
        <a href="adventure-log.html">Adventure Log</a>
        <a href="saved-quests.html">Saved Quests</a>
      </nav>

      <div class="brand-mark" aria-hidden="true">
        <span>↗</span>
      </div>

      <p class="eyebrow">A little spark for your day</p>
      <h1 id="page-title">Side<span>Quest.</span></h1>
      <p class="intro">
        Break the routine with one simple idea. Your next small adventure is only a click away.
      </p>

      <button class="quest-button" id="generate-quest" type="button">
        <span>Generate a Quest</span>
        <span class="button-arrow" aria-hidden="true">→</span>
      </button>

      <a class="quiz-page-link" href="quiz.html">
        <span aria-hidden="true">✦</span>
        Help Me Choose
        <span aria-hidden="true">→</span>
      </a>

      <div class="quest-card" id="quest-card" aria-live="polite" aria-atomic="true" hidden>
        <div class="quest-meta">
          <p id="quest-category" class="quest-label"></p>
          <p id="quest-effort" class="quest-effort"></p>
          <button class="save-quest-button" id="save-quest" type="button" aria-label="Save quest" aria-pressed="false" title="Save quest">
            <span class="save-quest-icon" id="save-quest-icon" aria-hidden="true">&#9825;</span>
          </button>
        </div>
        <p class="quest-idea" id="quest-idea"></p>
      </div>

      <p class="hint">No planning. No pressure. Just try something new.</p>
    </section>
  </main>

  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>
</body>
</html>
